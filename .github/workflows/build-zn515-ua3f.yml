name: Build ZN515XG-D + UA3F

on:
  push:
    branches: [zn515-ua3f]
    paths:
      - .github/workflows/build-zn515-ua3f.yml
      - configs/zn515-ua3f.config
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-zn515-ua3f
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  UA3F_SHA: 8747234bf24fe538b0358aabc7671b027fb37f20

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare build machine
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # This job uses a disposable GitHub-hosted Ubuntu VM. OpenWrt builds
          # its own toolchains; the preinstalled SDK cache is not required.
          df -h .
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          if command -v docker >/dev/null 2>&1; then
            sudo docker image prune --all --force || true
          fi
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd
          sudo apt-get clean
          mkdir -p build-record firmware
          available_kib=$(df --output=avail -k . | tail -n 1)
          if [ "$available_kib" -lt $((30 * 1024 * 1024)) ]; then
            df -h . | tee build-record/disk-too-small.txt
            echo '::error::Need at least 30 GiB free after runner cleanup for the full PonWrt + Go build.'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git checkout -B zn515-source "$SOURCE_SHA"
          git branch --set-upstream-to=origin/master zn515-source
          git rev-parse HEAD > build-record/source-sha.txt
          git log -1 --format=fuller > build-record/source-commit.txt
          df -h | tee build-record/disk.txt
          free -h | tee build-record/memory.txt

      - name: Check out pinned UA3F source
        uses: actions/checkout@v6
        with:
          repository: SunBK201/UA3F
          ref: ${{ env.UA3F_SHA }}
          path: package/UA3F
          persist-credentials: false

      - name: Record UA3F source
        run: |
          test "$(git -C package/UA3F rev-parse HEAD)" = "$UA3F_SHA"
          git -C package/UA3F rev-parse HEAD > build-record/ua3f-sha.txt
          git -C package/UA3F log -1 --format=fuller > build-record/ua3f-commit.txt

      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: zn515-ua3f-dl-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          restore-keys: zn515-ua3f-dl-

      - name: Update official feeds
        run: |
          ./scripts/feeds update -a 2>&1 | tee build-record/feeds-update.log
          ./scripts/feeds install -a 2>&1 | tee build-record/feeds-install.log
          for feed in packages luci routing telephony video pon_drivers pon_userspace; do
            printf '%s %s\n' "$feed" "$(git -C "feeds/$feed" rev-parse HEAD)" >> build-record/feed-shas.txt
          done

      - name: Configure standard ZN515XG-D only
        run: |
          cp configs/an7581.config .config
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('.config')
          selected = 'CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_znxt_zn515xg-d'
          unpublished_feeds = ('video', 'pon_drivers', 'pon_userspace')
          unpublished_feed_options = {f'CONFIG_FEED_{feed}=y' for feed in unpublished_feeds}
          source = p.read_text()
          for feed in unpublished_feeds:
              assert source.count(f'CONFIG_FEED_{feed}=y') == 1, feed
          out, seen = [], set()
          for line in source.splitlines():
              m = re.fullmatch(r'(CONFIG_TARGET_DEVICE_(?!PACKAGES_)[^=]+)=[ym]', line)
              if m:
                  key = m.group(1)
                  out.append(f'{key}=y' if key == selected else f'# {key} is not set')
                  seen.add(key)
              elif line in ('CONFIG_KERNEL_DEBUG_INFO=y',
                            'CONFIG_KERNEL_DEBUG_INFO_REDUCED=y',
                            'CONFIG_KERNEL_DEBUG_INFO_BTF=y',
                            'CONFIG_COLLECT_KERNEL_DEBUG=y'):
                  # Runtime TPROXY support does not require DWARF/BTF symbols.
                  out.append(f'# {line.partition("=")[0]} is not set')
              elif line in unpublished_feed_options:
                  out.append(f'# {line.partition("=")[0]} is not set')
              elif line == 'CONFIG_TARGET_ALL_PROFILES=y':
                  out.append('# CONFIG_TARGET_ALL_PROFILES is not set')
              else:
                  out.append(line)
          assert selected in seen, 'Device symbol changed'
          p.write_text('\n'.join(out) + '\n')
          PY
          ./scripts/kconfig.pl + .config configs/zn515-ua3f.config > .config.ua3f
          mv .config.ua3f .config
          make defconfig 2>&1 | tee build-record/configure.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('.config').read_text()
          for line in Path('configs/zn515-ua3f.config').read_text().splitlines():
              if line.startswith('CONFIG_'):
                  assert line in text.splitlines(), f'Required UA3F option lost: {line}'
          for key in ('KERNEL_DEBUG_INFO', 'KERNEL_DEBUG_INFO_BTF', 'COLLECT_KERNEL_DEBUG'):
              assert f'CONFIG_{key}=y' not in text.splitlines(), key
          devices = re.findall(r'^CONFIG_TARGET_DEVICE_(?!PACKAGES_)([^=]+)=y$', text, re.M)
          assert devices == ['airoha_an7581_DEVICE_znxt_zn515xg-d'], devices
          for feed in ('packages', 'luci', 'routing', 'telephony'):
              assert re.search(r'^CONFIG_FEED_' + feed + '=y$', text, re.M), feed
          for feed in ('video', 'pon_drivers', 'pon_userspace'):
              assert not re.search(r'^CONFIG_FEED_' + feed + '=[ym]$', text, re.M), feed
          for key in ['TARGET_airoha', 'TARGET_airoha_an7581', 'TARGET_MULTI_PROFILE',
                      'TARGET_PER_DEVICE_ROOTFS', 'PACKAGE_luci', 'PACKAGE_luci-app-pon',
                      'PACKAGE_luci-i18n-base-zh-cn', 'PACKAGE_airoha-ponctl', 'PACKAGE_airoha-pond']:
              assert re.search(r'^CONFIG_' + re.escape(key) + '=y$', text, re.M), key
          for key in ['kmod-mt7915e', 'kmod-mt7916-firmware', 'znxt-zn515-mt7916-eeprom',
                      'wpad-openssl', 'kmod-usb3', 'kmod-phy-airoha-en8811h',
                      'kmod-airoha-en7572', 'kmod-airoha-xpon', 'block-mount',
                      'kmod-usb-storage', 'kmod-usb-storage-uas', 'kmod-fs-ext4',
                      'kmod-fs-vfat', 'kmod-fs-exfat', 'fitblk']:
              assert re.search(r'^CONFIG_PACKAGE_' + re.escape(key) + '=[ym]$', text, re.M), key
          PY
          cp .config build-record/config.full
          ./scripts/diffconfig.sh > build-record/config.diff
      - name: Skip unused Python ctypes module
        run: |
          if grep -Eq '^CONFIG_PACKAGE_(python3-ctypes|libffi)=[ym]$' .config; then
            echo 'Python ctypes or libffi is selected; cannot skip it' >&2
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('feeds/packages/lang/python/python3/Makefile')
          source = path.read_text()
          marker = 'py_cv_module_nis=n/a'
          assert source.count(marker) == 1, 'Python package rules changed'
          source = source.replace(marker, marker + ' \\\n\tpy_cv_module__ctypes=n/a', 1)
          path.write_text(source)
          PY
          git -C feeds/packages diff -- lang/python/python3/Makefile > build-record/python3-ctypes-workaround.patch
          test -s build-record/python3-ctypes-workaround.patch



      - name: Download sources
        run: make download -j"$(nproc)" 2>&1 | tee build-record/download.log

      - name: Compile firmware
        run: |
          df -h . | tee build-record/disk-before-build.txt
          available_kib=$(df --output=avail -k . | tail -n 1)
          if [ "$available_kib" -lt $((20 * 1024 * 1024)) ]; then
            echo '::error::Less than 20 GiB free before compilation; stopping early to preserve logs.'
            exit 1
          fi
          (
            while true; do
              date -u
              df -h .
              sleep 60
            done
          ) > build-record/disk-during-build.log 2>&1 &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true' EXIT
          if ! make -j"$(nproc)" 2>&1 | tee build-record/build.log; then
            df -h . | tee build-record/disk-after-failure.txt
            available_kib=$(df --output=avail -k . | tail -n 1)
            if [ "$available_kib" -lt $((5 * 1024 * 1024)) ]; then
              echo '::error::Build exhausted disk space; skipping retry to preserve remaining space.'
              exit 1
            fi
            make -j1 V=s 2>&1 | tee build-record/build-retry.log
          fi

      - name: Verify and collect firmware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, shutil
          root = Path('bin/targets/airoha/an7581')
          data = json.loads((root / 'profiles.json').read_text())
          assert data['target'] == 'airoha/an7581', data['target']
          assert set(data['profiles']) == {'znxt_zn515xg-d'}, data['profiles'].keys()
          profile = data['profiles']['znxt_zn515xg-d']
          assert 'znxt,zn515xg-d' in profile['supported_devices']
          assert (root / 'version.buildinfo').read_text().strip() == data['version_code']
          names = []
          for item in profile['images']:
              path = root / item['name']
              assert path.is_file() and path.stat().st_size > 0, path
              assert hashlib.sha256(path.read_bytes()).hexdigest() == item['sha256'], path
              if 'size' in item:
                  assert path.stat().st_size == item['size'], path
              shutil.copy2(path, 'firmware')
              names.append(path.name)
          assert any('squashfs-sysupgrade.itb' in name for name in names), names
          assert any('initramfs-recovery.itb' in name for name in names), names
          manifests = [path for path in root.glob('*zn515xg-d*.manifest') if '10g' not in path.name]
          assert manifests, 'ZN515 package manifest missing'
          required = {'ua3f', 'luci-compat', 'libubox-lua', 'ip-full',
                      'firewall4', 'nftables-json', 'kmod-nft-tproxy',
                      'kmod-nf-tproxy', 'kmod-nf-conntrack-netlink'}
          for path in manifests:
              packages = {line.split(' - ', 1)[0] for line in path.read_text().splitlines()}
              assert required <= packages, f'{path}: missing {required - packages}'
          kernels = list(Path('build_dir').glob('target-*/linux-airoha_an7581/linux-*/.config'))
          assert len(kernels) == 1, kernels
          kernel = kernels[0].read_text().splitlines()
          for key in ('IP_MULTIPLE_TABLES', 'IPV6_MULTIPLE_TABLES',
                      'NF_TPROXY_IPV4', 'NF_TPROXY_IPV6', 'NFT_TPROXY'):
              assert any(f'CONFIG_{key}={value}' in kernel for value in ('y', 'm')), key
          shutil.copy2(kernels[0], 'build-record/kernel.config')
          for name in ['profiles.json', 'version.buildinfo', 'config.buildinfo', 'feeds.buildinfo']:
              shutil.copy2(root / name, 'firmware')
          for path in root.glob('*zn515xg-d*.manifest'):
              shutil.copy2(path, 'firmware')
          for path in root.glob('*.manifest'):
              if 'zn515xg-d' in path.name and '10g' not in path.name:
                  text = path.read_text()
                  for unwanted in ['luci-app-passwall', 'luci-app-openclash', 'luci-app-rclone', 'dockerd']:
                      assert unwanted not in text, unwanted
          print('Validated:', data['version_code'], names)
          PY
          cp build-record/source-sha.txt build-record/feed-shas.txt build-record/ua3f-sha.txt firmware/
          (cd firmware && sha256sum *.itb > SHA256SUMS)
          printf '### ZN515XG-D + UA3F firmware\n\nSource: `%s`\n\n' "$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          cat firmware/version.buildinfo >> "$GITHUB_STEP_SUMMARY"
          printf '\nUA3F source: `%s`\n' "$UA3F_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-ZN515XG-D-UA3F-${{ github.run_number }}
          path: firmware/
          if-no-files-found: error
          retention-days: 7

      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zn515-ua3f-build-record-${{ github.run_number }}
          path: build-record/
          if-no-files-found: warn
          retention-days: 7
